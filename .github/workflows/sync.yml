name: Pillory Sync
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/the-pillory-sync" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"