name: Pillory Sync
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pillory sync
        run: |
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/pillory-sync" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"